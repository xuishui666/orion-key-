name: Project checks
on:
  push:
    branches: ['work/payment-admin-*']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orion_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orion_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - run: mvn -B test
        working-directory: apps/api
      - name: PostgreSQL order security and support deletion regression
        working-directory: apps/api
        run: >-
          mvn -B -Dtest=OrderPrivacyAndDeliveryTests,SupportDeletionTests
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/orion_test
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=postgres
          -Dspring.datasource.password=test-only-password test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
