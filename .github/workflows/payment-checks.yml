name: Payment regression checks
on:
  push:
    branches: ['work/payment-admin-*']
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - run: mvn -B test
        working-directory: apps/api
